services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: lista_compras
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senha
    command: --host-cache-size=0 --skip-name-resolve
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lista-compras-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
    container_name: frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - lista-compras-network
  backend:
    build:
      context: ./api
    container_name: backend
    restart: always
    environment:
      DATABASE_URL: "${DATABASE_URL_DOCKER}"
      PORT: "${PORT}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - lista-compras-network
    command: >
      sh -c "
        echo 'Aguardando MySQL...' &&
        sleep 10 &&
        npx prisma migrate deploy &&
        npm start
      "

volumes:
  mysql_data:

networks:
  lista-compras-network:
    driver: bridge
